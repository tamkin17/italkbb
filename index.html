// ---------- 全域輔助函數 ----------
// 初始化三個服務列 (產生三組下拉選單)
function buildTableRows() {
  const tbody = document.querySelector("#serviceTable tbody");
  tbody.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const tr = document.createElement("tr");
    // 服務欄位
    const tdService = document.createElement("td");
    tdService.setAttribute("data-label", "服務");
    const serviceSelect = document.createElement("select");
    serviceSelect.setAttribute("onchange", "onServiceChange(this)");
    tdService.appendChild(serviceSelect);
    
    // 合約欄位
    const tdContract = document.createElement("td");
    tdContract.setAttribute("data-label", "合約");
    const contractSelect = document.createElement("select");
    contractSelect.setAttribute("onchange", "calculateRow(this)");
    tdContract.appendChild(contractSelect);
    
    // 價錢顯示
    const tdPrice = document.createElement("td");
    tdPrice.setAttribute("data-label", "價錢");
    tdPrice.className = "price";
    tdPrice.innerText = "-";
    
    // 特選客戶
    const tdSpecial = document.createElement("td");
    tdSpecial.setAttribute("data-label", "客戶類型");
    tdSpecial.className = "special";
    const specialSelect = document.createElement("select");
    specialSelect.setAttribute("onchange", "calculateRow(this)");
    tdSpecial.appendChild(specialSelect);
    
    // 優惠內容
    const tdDiscount = document.createElement("td");
    tdDiscount.setAttribute("data-label", "優惠");
    tdDiscount.className = "discount";
    tdDiscount.innerText = "-";
    
    // 首年總價
    const tdYear1 = document.createElement("td");
    tdYear1.setAttribute("data-label", "首年");
    tdYear1.className = "year1";
    tdYear1.innerText = "-";
    
    // 2年總價
    const tdYear2 = document.createElement("td");

    tdYear2.className = "year2";
    tdYear2.innerText = "-";
    
    tr.appendChild(tdService);
    tr.appendChild(tdContract);
    tr.appendChild(tdPrice);
    tr.appendChild(tdSpecial);
    tr.appendChild(tdDiscount);
    tr.appendChild(tdYear1);
    tr.appendChild(tdYear2);
    tbody.appendChild(tr);
  }
  // 填充服務選項 (基本選單)
  initAllServiceOptions();
}

function initAllServiceOptions() {
  const allServiceSelects = document.querySelectorAll("tbody tr td:first-child select");
  const baseOptionsHtml = `

    <option disabled class="category-header">─ Prime APP ─</option>
    <option value="Prime APP" class="prime-option">Prime APP</option>
    <option disabled class="category-header">─ 家居電話 ─</option>
    <option value="家居電話" class="phone-option">家居電話</option>
    <option disabled class="category-header">─ 關愛服務 ─</option>

  // 重置每行的合約 & 特選客戶初始為空
  document.querySelectorAll("tbody tr").forEach(row => {
    const contractSel = row.querySelectorAll("select")[1];
    const specialSel = row.querySelector(".special select");
    contractSel.innerHTML = '<option value="">-- 合約期 --</option>';
    specialSel.innerHTML = '<option value="0">--特選客戶--</option>';

    row.querySelector(".price").innerText = "-";

}

// 服務變更時: 更新合約下拉、特選客戶下拉、顯示基礎月費/年費
function onServiceChange(sel) {
  const row = sel.closest("tr");
  const contractSel = row.querySelectorAll("select")[1];
  const specialSel = row.querySelector(".special select");
  const serviceName = sel.value;
  const data = serviceData[serviceName];
  
  // 清空合約與特選客戶
  contractSel.innerHTML = '<option value="">-- 合約期 --</option>';
  specialSel.innerHTML = '<option value="0">--特選客戶--</option>';
  
  if (!data) {
    row.querySelector(".price").innerText = "-";
    calculateRow(sel);  // 觸發總價更新清除
    return;
  }
  
  // 載入合約期選項
  Object.keys(data.contracts).forEach(monthVal => {
    contractSel.innerHTML += `<option value="${monthVal}">${monthVal} 個月</option>`;
  });
  
  // 載入特選客戶選項 (若有special)
  if (data.special && data.special.options) {
    data.special.options.forEach(opt => {
      let classNameAttr = '';
      if (opt.small || opt.extraSmall) classNameAttr = 'class="special-small"';
      // 保留 creditValue 屬性以便計算時抓取額外credit，儲存data屬性
      const creditDataAttr = (opt.hasCredit && opt.creditValue) ? `data-credit="${opt.creditValue}"` : '';
      specialSel.innerHTML += `<option value="${opt.extra}" ${classNameAttr} ${creditDataAttr}>${opt.text}</option>`;
    });
  }
  
  // 更新價格顯示欄位 (月費/年費)
  updatePriceDisplay(row);
  calculateRow(sel);
}

function updatePriceDisplay(row) {
  const serviceSelect = row.querySelectorAll("select")[0];
  const serviceName = serviceSelect.value;
  const d = serviceData[serviceName];
  if (!d) return;
  const priceCell = row.querySelector(".price");
  const specialSel = row.querySelector(".special select");
  let extraVal = 0;
  if (specialSel && specialSel.value !== "0" && specialSel.value !== "") {
    extraVal = parseFloat(specialSel.value) || 0;
  }
  
  if (d.yearly) {
    priceCell.innerText = `$${d.yearly} / 年`;
  } else if (d.fee !== undefined) {
    let monthly = d.fee + extraVal;
    priceCell.innerText = `$${monthly.toFixed(2)} / 月`;
  } else {
    priceCell.innerText = "-";
  }
}

// 核心計算: 首年/2年總支出 及優惠說明
function calculateRow(triggerEl) {
  const row = triggerEl.closest("tr");
  const serviceSelect = row.querySelectorAll("select")[0];
  const serviceName = serviceSelect.value;
  const contractMonths = row.querySelectorAll("select")[1].value;
  const specialSel = row.querySelector(".special select");
  const d = serviceData[serviceName];
  
  // 更新價格顯示 (月費可能因特選客戶變動)
  updatePriceDisplay(row);
  
  if (!d || !contractMonths) {
    row.querySelector(".discount").innerText = "-";
    row.querySelector(".year1").innerText = "-";
    row.querySelector(".year2").innerText = "-";
    calcAvg();
    return;
  }
  
  // 取得基礎月費 / 年費模式
  let extraSpecial = 0;
  let extraCreditFromOption = 0;  // 特殊選項額外credit (例如TELUS 3000M 手機優惠 -50)
  if (specialSel && specialSel.value !== "0" && specialSel.value !== "") {
    extraSpecial = parseFloat(specialSel.value) || 0;
    // 抓取選定option的額外credit (若有 data-credit)
    const selectedOpt = specialSel.options[specialSel.selectedIndex];
    if (selectedOpt && selectedOpt.dataset && selectedOpt.dataset.credit) {
      extraCreditFromOption = parseFloat(selectedOpt.dataset.credit) || 0;
    }
  }
  
  let baseMonthly = d.fee ? d.fee + extraSpecial : 0;
  const isYearlyPlan = d.yearly ? true : false;
  const rule = d.contracts[contractMonths];
  let year1Total = 0, year2Total = 0;
  let discountText = "-";
  
  // 特殊邏輯處理 (攝像頭/門磁/prime/家居電話/平安通)
  if (rule.camera || rule.camera2) {
    const fee = rule.camera ? 9.99 : 13.99;
    // 首年: 第1月免費，2~6月 $4.99 (5個月), 7~12月原價 (6個月)
    year1Total = (4.99 * 5) + (fee * 6);
    year2Total = year1Total + (fee * 12);
    discountText = rule.discountText;
  } 
  else if (rule.doorSensor1) {
    // 門磁 $9.99: 首12月免費
    year1Total = 0;
    year2Total = 9.99 * 12;
    discountText = rule.discountText;
  }
  else if (rule.doorSensor2) {
    // 門磁 $13.99: 首3月 $4.99/月，之後9月原價
    year1Total = (4.99 * 3) + (13.99 * 9);
    year2Total = year1Total + (13.99 * 12);
    discountText = rule.discountText;
  }
  else if (rule.prime || rule.homePhone18) {
    const promoPrice = rule.prime ? 4.49 : 4.5;
    year1Total = (promoPrice * 6) + (8.99 * 6);
    year2Total = year1Total + (8.99 * 12);
    discountText = rule.discountText;
  }
  else if (rule.homePhone24) {
    // 首3月免費, 最後3月免費 => 24個月內總共18個月付費
    year1Total = 8.99 * 9;   // 前9個月付費(第1-3月免費,4-12月收9個月)
    year2Total = year1Total + (8.99 * 9); // 第二年最後3月免費 => 9個月付費
    discountText = rule.discountText;
  }
  else if (rule.safetyCare) {
    // 平安通: 一年合約 (12個月) 首2個月4.99, 其餘10個月原價9.99
    // 因為只有一年合約，但總價計算需要2年總支出: 第二年可視為續約相同條件？但為符合平均概念: 兩年合約只能選12個月, 邏輯：2年總支出 = 首年優惠 + 第二年原價12個月
    // 詳細: 首年 = 4.99*2 + 9.99*10 = 9.98 + 99.9 = 109.88；第二年若無優惠 = 9.99*12 = 119.88；總和 = 229.76
    const firstYear = (4.99 * 2) + (9.99 * 10);
    const secondYear = 9.99 * 12;
    year1Total = firstYear;
    year2Total = firstYear + secondYear;
    discountText = rule.discountText;
  }
  else {
    // 標準合約: 贈送月份 & 帳單credit
    let freeMonths = rule.free || 0;
    let creditAmount = rule.credit || 0;
    // 加總特殊選項提供的額外credit (ex: Telus 3000M -50)
    let totalCredit = creditAmount + extraCreditFromOption;
    
    // 首年 = baseMonthly * (12 - freeMonths) - totalCredit
    year1Total = baseMonthly * (12 - freeMonths) - totalCredit;
    // 二年總支出 = 首年支出 + baseMonthly * 12
    year2Total = year1Total + (baseMonthly * 12);
    
    let parts = [];
    if (freeMonths > 0) parts.push(`免費 ${freeMonths} 個月`);
    if (totalCredit > 0) parts.push(`-$${totalCredit} Credit`);
    if (parts.length > 0) discountText = parts.join('，');
    else discountText = "-";
  }
  
  // 確保數值不小於0 (理論上不會負數太誇張，但保險)
  year1Total = Math.max(0, year1Total);
  year2Total = Math.max(0, year2Total);
  
  // 更新DOM
  row.querySelector(".discount").innerText = discountText;
  row.querySelector(".year1").innerHTML = year1Total !== undefined ? "$" + year1Total.toFixed(2) : "$0.00";
  row.querySelector(".year2").innerHTML = year2Total !== undefined ? "$" + year2Total.toFixed(2) : "$0.00";
  
  calcAvg();
}

// 計算三行的平均每月總支出 (2年總和/24)
function calcAvg() {
  let totalTwoYearCost = 0;
  let anyValid = false;
  const year2Cells = document.querySelectorAll(".year2");
  for (let cell of year2Cells) {
    const rawText = cell.innerText;
    if (rawText && rawText.startsWith("$")) {
      const val = parseFloat(rawText.slice(1));
      if (!isNaN(val) && val >= 0) {
        totalTwoYearCost += val;
        anyValid = true;
      }
    }
  }
  if (!anyValid || totalTwoYearCost === 0) {
    document.getElementById("avg").innerText = "-";
    document.getElementById("avgTax").innerText = "-";
    return;
  }
  const avgMonthly = totalTwoYearCost / 24;
  const avgWithTax = avgMonthly * 1.12;
  document.getElementById("avg").innerHTML = `$${avgMonthly.toFixed(2)}`;
  document.getElementById("avgTax").innerHTML = `$${avgWithTax.toFixed(2)}`;
}

// 初始化頁面: 建立3行表格，設定所有監聽並重置
function init() {
  buildTableRows();
  // 綁定全域額外監聽（當特選客戶變動時也會重新計算，calculateRow已含）
  // 另外針對select變動可重新整理
  document.querySelector("#serviceTable tbody").addEventListener("change", function(e) {
    if(e.target && e.target.tagName === "SELECT") {
      // 若變動的是服務欄位，onServiceChange已經呼叫calculateRow; 若合約或特選客戶直接呼叫calculateRow
      // 但為防重複呼叫，但無副作用
      const row = e.target.closest("tr");
      if(row && (e.target.closest("td").getAttribute("data-label") === "服務" || e.target === row.querySelectorAll("select")[0])) {
        // 已在onServiceChange內完成calculate
      } else {
        if (typeof calculateRow === "function") calculateRow(e.target);
      }
    }
  });
}

// 執行初始化
init();
</script>
